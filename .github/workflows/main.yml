name: Build Fateh Messenger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 4 -type f -name '*.zip' \
            ! -path './extracted/*' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No project ZIP found in repository."
            exit 1
          fi

          echo "Extracting $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

          SETTINGS=$(find extracted -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::No Gradle project found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Locate Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG=""

          if [ -f "app/google-services.json" ]; then
            CONFIG="app/google-services.json"
          else
            CONFIG=$(find . -maxdepth 6 -type f \
              -name 'google-services.json' \
              ! -path './extracted/*' -print -quit || true)
          fi

          if [ -z "$CONFIG" ]; then
            echo "::error::google-services.json not found in repository."
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/app"
          cp "$CONFIG" "$PROJECT_DIR/app/google-services.json"

          echo "Firebase configuration copied successfully."

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "::error::gradlew is missing from the Android project."
            exit 1
          fi

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fateh-Messenger-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
